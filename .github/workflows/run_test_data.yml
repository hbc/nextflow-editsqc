name: run test data

on:
  pull_request:
      branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '24'
          
      - name: Set JAVA_HOME for Nextflow
        run: echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV

      - name: Install Nextflow
        run: |
          wget -qO- https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/

      # Resource caps live in conf/test.config and conf/test_genome.config
      - name: Run Nextflow pipeline on test data
        run: |
          nextflow run main.nf -profile test,docker

      # Genome-only samplesheet with a blank region column: checks that the
      # region/IGV processes are skipped instead of running on a missing contig
      - name: Run Nextflow pipeline on genome-only test data
        run: |
          nextflow run main.nf -profile test_genome,docker
